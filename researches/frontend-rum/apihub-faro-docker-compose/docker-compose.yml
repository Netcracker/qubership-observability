version: '3.9'
services:
  ################################################# APIHUB components ################################################
  qubership-apihub-backend:
    image: ghcr.io/netcracker/qubership-apihub-backend:dev@sha256:69c4e0b83ff7427895b96dca371e814646a1de8d1b3677858bf3c9329b3b0290
    #image: localhost/netcracker/qubership-apihub-backend:latest
    container_name: qubership-apihub-backend
    ports:
    - "8090:8080"
    - "47375:47375"
    - "47376:47376"
    environment:
    - APIHUB_CONFIG_FOLDER=/app/qubership-apihub-service/
    - GOMEMLIMIT=800MiB
    volumes:
    - ./qubership-apihub-backend-config.yaml:/app/qubership-apihub-service/config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail localhost:8080/ready || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      default:
        aliases:
        - qubership-apihub-backend
    depends_on:
      postgres:
        condition: service_healthy

  qubership-apihub-build-task-consumer:
    image: ghcr.io/netcracker/qubership-apihub-build-task-consumer:dev@sha256:53f6d9e723e9a18a67edf12e13c9a41c74b5c221d65d98ed50816b3887aa7e4e
    container_name: qubership-apihub-build-task-consumer
    ports:
    - "3001:3001"
    env_file: "qubership-apihub-build-task-consumer.env"
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail localhost:3000/live || exit 1" ]
      interval: 120s
      timeout: 60s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      default:
        aliases:
        - qubership-apihub-build-task-consumer
    depends_on:
      qubership-apihub-backend:
        condition: service_healthy

  qubership-apihub-ui:
    image: ghcr.io/netcracker/qubership-apihub-ui:feature-integrate-grafana-faro@sha256:348fa43b602ecaaf16dc52ddfcae3a795c24bf0d5661bc9e4d1b2502df543f72
    container_name: qubership-apihub-ui
    ports:
    - "8081:8080"
    env_file: "qubership-apihub-ui.env"
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail localhost:8080/probes/live || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
    networks:
      default:
        aliases:
        - qubership-apihub-ui
    depends_on:
      qubership-apihub-backend:
        condition: service_healthy

  qubership-api-linter-service:
    image: ghcr.io/netcracker/qubership-api-linter-service:dev@sha256:561aa89ecd76f9e7265d13e4bfe079360abcdb30cea0b6ac413b9a89a48ff388
    container_name: qubership-api-linter-service
    ports:
    - "8091:8080"
    env_file: "qubership-api-linter-service.env"
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail localhost:8080/ready || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      default:
        aliases:
        - qubership-api-linter-service
    depends_on:
      qubership-apihub-ui:
        condition: service_healthy

  qubership-apihub-agents-backend:
    image: ghcr.io/netcracker/qubership-apihub-agents-backend:dev@sha256:caf86d62fe6eea09baa0c3fa45ce68aab8a19a3b51b27a2984466b86600c0cbc
    container_name: qubership-apihub-agents-backend
    ports:
    - "8092:8080"
    env_file: "qubership-apihub-agents-backend.env"
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail localhost:8080/ready || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      default:
        aliases:
        - qubership-apihub-agents-backend
    depends_on:
      qubership-apihub-ui:
        condition: service_healthy

  postgres:
    image: docker.io/postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    container_name: postgres
    command:
    - "postgres"
    - "-c"
    - "max_connections=50"
    - "-c"
    - "shared_buffers=1GB"
    - "-c"
    - "effective_cache_size=1GB"
    - "-c"
    - "work_mem=16MB"
    - "-c"
    - "maintenance_work_mem=512MB"
    - "-c"
    - "random_page_cost=1.1"
    - "-c"
    - "temp_file_limit=10GB"
    - "-c"
    - "log_min_duration_statement=200ms"
    - "-c"
    - "idle_in_transaction_session_timeout=10s"
    - "-c"
    - "lock_timeout=1s"
    - "-c"
    - "shared_preload_libraries=pg_stat_statements"
    - "-c"
    - "pg_stat_statements.max=10000"
    - "-c"
    - "pg_stat_statements.track=all"
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=postgres
    - PGDATA=/pgdata
    ports:
    - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3G
    volumes:
    - './data:/var/lib/postgresql/data:Z'
    - './scripts/init-db:/docker-entrypoint-initdb.d'

  ############################################# OTEC + Backend Telemetry #############################################

  # OpenTelemetry Collector — single entrypoint for all Grafana Faro telemetry (OTLP).
  # Fans out: logs -> VictoriaLogs, traces -> Grafana Tempo.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
    - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
    - "4317:4317"   # OTLP gRPC
    - "4318:4318"   # OTLP HTTP (Faro browser SDK sends here)
    - "13133:13133" # health_check
    depends_on:
    - victorialogs
    - tempo
    restart: unless-stopped

  # VictoriaLogs — log storage & query backend.
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    container_name: victorialogs
    command:
    - "--storageDataPath=/vlogs"
    - "--httpListenAddr=:9428"
    volumes:
    - ./data/victorialogs:/vlogs
    ports:
    - "9428:9428"
    restart: unless-stopped

  # Grafana Tempo — trace storage & query backend.
  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0:0"
    volumes:
    - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
    - ./data/tempo:/var/tempo
    ports:
    - "3200:3200"   # Tempo query API
    restart: unless-stopped

  # Grafana — visualization, wired to both VictoriaLogs and Tempo.
  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
    volumes:
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./data/grafana:/var/lib/grafana
    ports:
    - "3000:3000"
    depends_on:
    - victorialogs
    - tempo
    restart: unless-stopped
